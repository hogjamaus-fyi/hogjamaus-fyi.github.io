<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Austin James Hogan | Under Construction</title>
  <meta name="description" content="Austin James Hogan — site under construction." />
  <meta name="author" content="Austin James Hogan" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#11161c" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #11161c;
      --surface: #1a2130;
      --border: #2a3550;
      --accent: #4f8ef7;
      --accent-dim: #2a4a8a;
      --text: #d4dde8;
      --text-muted: #6b7fa0;
      --warn: #f7a84f;
      --radius: 12px;
      --font-body: 'Space Grotesk', system-ui, sans-serif;
      --font-display: 'Fraunces', Georgia, serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      position: relative;
      overflow-x: hidden;
    }

    /* animated grid backdrop */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    /* slow pulse on grid */
    @keyframes pulse-grid {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 0.45; }
    }
    body::before { animation: pulse-grid 6s ease-in-out infinite; }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 0 1px var(--border), 0 24px 64px rgba(0,0,0,0.6);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--accent-dim);
      margin-bottom: 1.75rem;
    }

    /* blinking dot */
    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.2s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .progress-wrap {
      margin-bottom: 2rem;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      background: var(--border);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      width: 0%;
      animation: fill-bar 2.4s cubic-bezier(.4,0,.2,1) forwards 0.6s;
    }
    @keyframes fill-bar { to { width: 42%; } }

    .checklist {
      list-style: none;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 2rem;
    }

    .checklist li {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .checklist li.done { color: var(--text); }

    .checklist li::before {
      content: '○';
      flex-shrink: 0;
      color: var(--border);
      font-size: 0.9rem;
    }
    .checklist li.done::before { content: '✓'; color: var(--accent); }

    .footer-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      margin-top: 0.5rem;
    }

    .footer-note a {
      color: var(--accent);
      text-decoration: none;
    }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">In Development</div>

    <h1>Austin James Hogan</h1>
    <p class="subtitle">Something new is being built here.<br>Check back soon.</p>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Build progress</span>
        <span>~42%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <ul class="checklist">
      <li class="done">Domain &amp; hosting configured</li>
      <li class="done">Design system drafted</li>
      <li>Content migration</li>
      <li>Final review &amp; launch</li>
    </ul>

    <div class="footer-note">
      <p>
        In the meantime, find me on
        <a href="https://x.com/hogjamaus_fyi" target="_blank" rel="noopener noreferrer">@hogjamaus</a>
        &nbsp;·&nbsp;
        <a href="https://hogjamaus-fyi.medium.com/" target="_blank" rel="noopener noreferrer">Medium</a>
        &nbsp;·&nbsp;
        <a href="https://github.com/hogjamaus-fyi" target="_blank" rel="noopener noreferrer">GitHub</a>
      </p>
    </div>
  </div>
</body>
</html>
